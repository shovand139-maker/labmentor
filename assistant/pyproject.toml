[project]
name = "labmentor-assistant"
version = "1.0.0"
description = "Answers learner questions from the lab guide, with tool calling, hint policy and citation checks."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.118,<1",
  "uvicorn[standard]>=0.37,<1",
  "pydantic>=2.11,<3",
  "httpx2>=2.12,<3",
  "pyyaml>=6.0.2,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.2,<2",
  "ruff>=0.13,<1",
  "mypy>=1.18,<3",
  "types-PyYAML>=6.0.12",
]

azure = ["azure-identity>=1.19,<2"]

[project.scripts]
labmentor-evals = "labmentor_assistant.evals.__main__:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["labmentor_assistant"]
mypy_path = "src"
